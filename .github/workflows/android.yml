name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/ui.c', 'src/ui.h', 'src/font_m5x7.h', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish the APK to the android-builds branch
        if: always()
        run: |
          set -x
          mkdir -p out
          cp build.log out/build.log || true
          cp android/app/build/outputs/apk/release/app-release.apk out/ArchiveTV.apk 2>/dev/null || echo "no apk" > out/FAILED.txt
          cd out
          git init -q -b android-builds
          git config user.name "github-actions"; git config user.email "actions@github.com"
          echo "Built from ${GITHUB_SHA} on $(date -u)" > README.md
          git add -A && git commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-builds
